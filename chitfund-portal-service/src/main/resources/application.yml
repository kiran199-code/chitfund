spring:
  application:
    name: chitfund-portal-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chitfund}
    username: ${DB_USER:chitfund}
    password: ${DB_PASSWORD:chitfund}
    hikari:
      # Every connection runs with search_path = portal, so repositories use unqualified table names.
      schema: ${PORTAL_DB_SCHEMA:portal}
      maximum-pool-size: ${PORTAL_DB_POOL_SIZE:10}
  flyway:
    schemas: ${PORTAL_DB_SCHEMA:portal}
    default-schema: ${PORTAL_DB_SCHEMA:portal}
    create-schemas: true
    table: portal_schema_history
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info

chit:
  # How the portal reaches chitfund-service (HTTP Basic service credential, the same one the batch service uses).
  service:
    base-url: ${CHIT_SERVICE_BASE_URL:http://localhost:8086}
    username: ${CHIT_SERVICE_USERNAME:chit-service}
    password: ${CHIT_SERVICE_PASSWORD:changeme}
    # Generous: a sleeping free-tier chitfund-service needs about a minute to wake.
    connect-timeout-seconds: 15
    request-timeout-seconds: 90
  portal:
    # Credential the admin console (or curl) uses for /api/v1/portal/admin/**. Different from the chit service credential.
    admin:
      username: ${PORTAL_ADMIN_USERNAME:portal-admin}
      password: ${PORTAL_ADMIN_PASSWORD:changeme}
    timezone: ${CHIT_TIMEZONE:Asia/Kolkata}
    # true only behind exactly one trusted proxy that appends to X-Forwarded-For (rate limits and audit then use its last entry)
    trust-forwarded-for: ${PORTAL_TRUST_FORWARDED_FOR:false}
    # Public address of the portal web app.
    base-url: ${PORTAL_BASE_URL:http://localhost:5173}
    # Browser origins allowed to call the member API with a session cookie (comma separated).
    allowed-origins: ${PORTAL_ALLOWED_ORIGINS:http://localhost:5173}
    session:
      hours: ${PORTAL_SESSION_HOURS:8}
      # (the cookie is always named portal_session)
      # Secure cookies need HTTPS. Keep true everywhere except a local http:// run.
      cookie-secure: ${PORTAL_COOKIE_SECURE:true}
      cookie-same-site: ${PORTAL_COOKIE_SAMESITE:Lax}
    google:
      # OAuth client id of the portal web app: the ID token's audience must equal it. Empty = sign-in refuses every token.
      client-id: ${GOOGLE_CLIENT_ID:}
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    rate-limit:
      sign-in-per-minute: 20
