# Render Blueprint for the chit fund: the three Spring Boot services. It does NOT create a database: Render allows only
# one free Postgres per account and the lending platform already uses it. Point DB_* at any PostgreSQL 14+ you own (a free
# Neon / Supabase / Aiven database is fine, or a paid Render Postgres). Create an EMPTY database called chitfund first; the
# services create their own schemas ("chit" and "batch") on first start. Do NOT point this at the lending database: the
# lending batch service already owns a schema called "batch" there.
#
# Free-tier trade-offs (this is a try-it setup, not production):
#  - Free web services sleep after ~15 min idle (the first request wakes them in about a minute). The batch service's
#    nightly end of day will not fire while it sleeps: run it from the admin console (End of day > Start).
#  - Free Render Postgres is deleted after 30 days; Neon's free database is not, which is one more reason to use it here.
#  - 512 MB RAM per service: the JVM heap is capped explicitly below.
services:
  # ---- chitfund-service: the chit API, ledger, business date and calendar ------------------------------------------
  - type: web
    name: chitfund-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./chitfund-service/Dockerfile
    dockerContext: ./chitfund-service
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_HOST
        sync: false   # from your database's connection details
      - key: DB_PORT
        sync: false   # from your database's connection details
      - key: DB_NAME
        sync: false   # from your database's connection details
      - key: DB_USER
        sync: false   # from your database's connection details
      - key: DB_PASSWORD
        sync: false   # from your database's connection details
      - key: CHIT_DB_SCHEMA
        value: chit
      - key: CHIT_DB_POOL_SIZE
        value: "5"
      - key: CHIT_SERVICE_USERNAME
        value: chit-service
      - key: CHIT_SERVICE_PASSWORD
        generateValue: true   # the batch and admin services read it from here (see below)
      # MANAGED: the business date is stored and moved forward by end of day. Use SYSTEM only when running for real
      # (the date then follows the wall clock and cannot be moved by hand).
      - key: CHIT_BUSINESS_DATE_MODE
        value: MANAGED
      - key: CHIT_TIMEZONE
        value: Asia/Kolkata
      - key: CHIT_WEEKEND_DAYS
        value: SATURDAY,SUNDAY
      # Sandbox only: allows Maintenance > Clear all data and setting the business date by hand. Remove (or "false")
      # where the data matters.
      - key: CHIT_RESET_ENABLED
        value: "true"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

  # ---- chitfund-batch-service: the three daily chit jobs and end of day ---------------------------------------------
  - type: web
    name: chitfund-batch-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./chitfund-batch-service/Dockerfile
    dockerContext: ./chitfund-batch-service
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "10000"
      - key: DB_HOST
        sync: false   # from your database's connection details
      - key: DB_PORT
        sync: false   # from your database's connection details
      - key: DB_NAME
        sync: false   # from your database's connection details
      - key: DB_USERNAME
        sync: false   # from your database's connection details
      - key: DB_PASSWORD
        sync: false   # from your database's connection details
      # Quartz (clustered JDBC store), Spring Batch metadata and the running jobs each need connections.
      - key: DB_POOL_SIZE
        value: "15"
      - key: DB_POOL_MIN_IDLE
        value: "3"
      - key: QUARTZ_THREAD_COUNT
        value: "3"
      - key: BATCH_SWAGGER_ENABLED
        value: "true"
      # No broker on this setup: Kafka publishing is switched off.
      - key: BATCH_KAFKA_ENABLED
        value: "false"
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: "localhost:9092"
      - key: BATCH_KAFKA_MAX_BLOCK_MS
        value: "1000"
      - key: BATCH_ADMIN_USERNAME
        value: batch-admin
      - key: BATCH_ADMIN_PASSWORD
        generateValue: true   # the admin service reads it from here
      # Sandbox only: lets Maintenance clear the job history together with the chit data.
      - key: BATCH_RESET_ENABLED
        value: "true"
      # Required: the prod profile refuses to start without it. The public address of chitfund-service
      # (Render dashboard > chitfund-service), https://chitfund-service-XXXX.onrender.com, no trailing slash.
      - key: CHIT_SERVICE_URL
        sync: false
      - key: CHIT_SERVICE_USERNAME
        value: chit-service
      - key: CHIT_SERVICE_PASSWORD
        fromService: { type: web, name: chitfund-service, envVarKey: CHIT_SERVICE_PASSWORD }
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

  # ---- chitfund-admin-service: the operations console (React UI and its API), no database -----------------------------
  - type: web
    name: chitfund-admin-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./chitfund-admin-service/Dockerfile
    dockerContext: ./chitfund-admin-service
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true   # read it in the Render dashboard > Environment
      # Operations logins (each gets every inquiry plus its own area). Passwords are generated; read them in the dashboard.
      - key: CHIT_OPS_PASSWORD
        generateValue: true   # user chit-ops: groups, enrolment, payments, holidays
      - key: BATCH_OPS_PASSWORD
        generateValue: true   # user batch-ops: batch jobs, end of day
      # Public addresses of the two services it talks to (Render dashboard), no trailing slash.
      - key: CHIT_SERVICE_URL
        sync: false
      - key: CHIT_SERVICE_USERNAME
        value: chit-service
      - key: CHIT_SERVICE_PASSWORD
        fromService: { type: web, name: chitfund-service, envVarKey: CHIT_SERVICE_PASSWORD }
      - key: BATCH_SERVICE_URL
        sync: false
      - key: BATCH_ADMIN_USERNAME
        value: batch-admin
      - key: BATCH_ADMIN_PASSWORD
        fromService: { type: web, name: chitfund-batch-service, envVarKey: BATCH_ADMIN_PASSWORD }
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

  # ---- chitfund-e2e-service: end-to-end test runner (page + API), no database ----------------------------------------
  # TEST ENVIRONMENTS ONLY. A run can clear all chit data and moves the business date forward. It talks to chitfund-service
  # and to a chitfund-portal-service started with SPRING_PROFILES_ACTIVE=e2e (mock sign-in, real Google sign-in OFF), so point
  # PORTAL_SERVICE_URL at a separate test portal, never at the portal your customers use. The portal is not part of this
  # Blueprint: create it by hand (or add it) and give it PORTAL_ADMIN_PASSWORD, which you paste here.
  # Delete this block if you do not want the test runner deployed.
  - type: web
    name: chitfund-e2e-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./chitfund-e2e-service/Dockerfile
    dockerContext: ./chitfund-e2e-service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: E2E_TEST_ENV
        value: "true"
      - key: E2E_UI_USERNAME
        value: e2e
      - key: E2E_UI_PASSWORD
        generateValue: true   # sign-in for the runner's page; read it in the Render dashboard > Environment
      - key: CHIT_SERVICE_URL
        sync: false           # public address of chitfund-service, no trailing slash
      - key: CHIT_SERVICE_USERNAME
        value: chit-service
      - key: CHIT_SERVICE_PASSWORD
        fromService: { type: web, name: chitfund-service, envVarKey: CHIT_SERVICE_PASSWORD }
      - key: PORTAL_SERVICE_URL
        sync: false           # public address of the TEST portal (e2e profile), no trailing slash
      - key: PORTAL_ORIGIN
        sync: false           # the browser origin that portal allows; usually the same address as PORTAL_SERVICE_URL
      - key: PORTAL_ADMIN_USERNAME
        value: portal-admin
      - key: PORTAL_ADMIN_PASSWORD
        sync: false           # the test portal's admin password
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
